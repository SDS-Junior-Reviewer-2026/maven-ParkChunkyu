name: Email Test

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Send Email with SES
        run: |
          aws ses send-email \
            --from "mincoding@naver.com" \
            --destination "ToAddresses=sejin.choi@mincoding.co.kr" \
            --message "Subject={Data=박천규}, Body={Text={Data=한 주 동안 강의하시느라 수고 많으셨습니다. 감사합니다~}}"